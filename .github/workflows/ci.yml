name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # Linux-only while this repo is private: macOS runners bill at 10x the
    # private-repo Actions quota. Add a macOS leg to this matrix once the
    # go-public flip lands (story 5.4's gate) - see BUILD_AUDIT.md EPIC 5.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run schema:parity

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run test
