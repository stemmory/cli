name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # TODO(5.4): add a macOS leg to this matrix once the repo goes public.
    # Private-repo GitHub Actions billing charges macOS runners at roughly
    # 10x the Linux per-minute rate, so macOS stays out while private.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run schema:parity

      - run: pnpm run build

      # STEM-105 follow-up: the published dist was believed to strip comments
      # (see RELEASING.md's "accepted as-is" note) and does not — verified
      # against the published 0.1.1, which shipped an internal ticket id and
      # several private spec-doc citations in dist/index.d.ts. Runs against
      # the real built artifact, so it must come after `pnpm run build`.
      - run: pnpm run check:dist-leaks

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run test
