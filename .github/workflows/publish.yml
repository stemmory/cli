name: Publish

# STEM-91 (5.4): publishes packages/cli (`stemmory`) and packages/schema
# (`@stemmory/schema`) to npm with provenance.
#
# Reachable ONLY by pushing a `vX.Y.Z` tag. No workflow_dispatch, no
# workflow_call, no pull_request_target, no repository_dispatch, no
# schedule, no push:branches trigger anywhere in this file. DO NOT add one.
#
# ⚠️ A GitHub Release IS a tag push. Clicking "Publish release" in the UI
# (or via API/PAT) creates the tag if it doesn't already exist, which fires
# the `push: tags` trigger below exactly the same as `git push --tags`. Do
# not treat "no dispatch button" as "no accidental path" - before the
# go-public flip, add a tag protection ruleset restricting who can create
# `v*` tags (Settings -> Rules -> Rulesets), and configure the `npm-publish`
# environment below with required reviewers. See RELEASING.md.
#
# Fails safe two independent ways, deliberately redundant rather than
# trusting a single signal or a careful reading of RELEASING.md's ordering:
#   1. The guard step checks the REPO'S ACTUAL VISIBILITY via the GitHub API
#      (not a file field - nothing to forget to commit).
#   2. It also checks every packages/*/package.json's `private` field.
# Either one alone being "not ready" blocks the run, regardless of which
# order a human did the flip steps in. npm/pnpm's own private-package guard
# does NOT fire under `--dry-run` (verified during STEM-91), so it isn't
# trusted as the only line of defense for something this irreversible.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # never cancel a run that may already be publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Requires a Settings -> Environments -> "npm-publish" environment with
    # required reviewers configured BEFORE the first tag. GitHub
    # auto-creates an environment referenced here with NO protection if it
    # doesn't exist yet, so this line alone is not the gate - the reviewer
    # requirement has to be added in repo settings. See RELEASING.md.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # required for npm provenance (OIDC). Job-scoped only,
      # not workflow-level, so a job added later here does not inherit it
      # by default.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse to publish while the repo is private or any package is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_private=$(gh api "repos/${{ github.repository }}" --jq .private)
          if [ "$is_private" = "true" ]; then
            echo "::error::repository ${{ github.repository }} is still private - refusing to publish. See RELEASING.md." >&2
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const pkgFiles = fs.readdirSync("packages", { withFileTypes: true })
              .filter((d) => d.isDirectory())
              .map((d) => `packages/${d.name}/package.json`)
              .filter((p) => fs.existsSync(p));
            const stillPrivate = pkgFiles.filter((p) => JSON.parse(fs.readFileSync(p, "utf8")).private);
            if (stillPrivate.length > 0) {
              console.error(`Refusing to publish: still marked "private": true -> ${stillPrivate.join(", ")}`);
              console.error("See RELEASING.md: private:true comes off as part of the same flip that makes the repo public, before any tag.");
              process.exit(1);
            }
          '

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run schema:parity

      - run: pnpm run build

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run test

      # Two packages, hardcoded on purpose: adding a third package already
      # means editing this file to add its own "Publish <pkg>" step (publish
      # ORDER is a dependency-graph decision a glob can't make safely), so
      # extend this check in the same edit rather than generalizing it alone.
      - name: Verify tag matches package versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cli_version=$(node -p "require('./packages/cli/package.json').version")
          schema_version=$(node -p "require('./packages/schema/package.json').version")
          if [ "$tag_version" != "$cli_version" ] || [ "$tag_version" != "$schema_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (version $tag_version) does not match packages/cli ($cli_version) or packages/schema ($schema_version)"
            exit 1
          fi

      # Schema first: cli depends on @stemmory/schema (workspace:*), and pnpm
      # resolves that to the published version range at publish time.
      #
      # Each publish step is idempotent (skips if the version is already on
      # the registry) so re-running this workflow after a transient failure
      # (registry 5xx, an npm token missing create-package permission for a
      # brand-new unscoped name, npm outage) can't publish schema, fail on
      # cli, and then be unable to retry without bumping+re-tagging both
      # packages and orphaning the already-published schema version.
      #
      # A prerelease version (contains "-", e.g. "0.2.0-rc.1") publishes
      # under the "next" dist-tag instead of "latest" so `npm install
      # stemmory` never silently picks up a prerelease.
      - name: Publish @stemmory/schema
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./packages/schema/package.json').version")
          if npm view "@stemmory/schema@$version" version >/dev/null 2>&1; then
            echo "@stemmory/schema@$version is already published - skipping."
          else
            npm_tag=latest
            case "$version" in *-*) npm_tag=next ;; esac
            # pnpm pack, then npm publish — deliberately not `pnpm publish`.
            #
            # pnpm 9.15's `publish` does not implement --provenance (it is
            # absent from `pnpm publish --help`); it accepted the flag, ignored
            # it, and exited 0, so v0.1.0 shipped with no attestation and
            # nothing failed. npm implements it, but cannot be used alone here:
            # packages/cli declares "@stemmory/schema": "workspace:*", which
            # only pnpm rewrites to a real version at pack time. `npm publish`
            # straight from the package dir would ship the literal
            # "workspace:*" and break every install.
            #
            # `pnpm pack` does the rewrite; `npm publish <tarball>` does the
            # provenance. Verified: the packed tarball declares "0.1.0".
            pnpm --filter @stemmory/schema exec pnpm pack --pack-destination "$RUNNER_TEMP"
            tgz=$(ls "$RUNNER_TEMP"/*.tgz | head -1)
            npm publish "$tgz" --access public --provenance --tag "$npm_tag"
            rm -f "$tgz"
          fi

      - name: Publish stemmory
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if npm view "stemmory@$version" version >/dev/null 2>&1; then
            echo "stemmory@$version is already published - skipping."
          else
            npm_tag=latest
            case "$version" in *-*) npm_tag=next ;; esac
            # pnpm pack, then npm publish — deliberately not `pnpm publish`.
            #
            # pnpm 9.15's `publish` does not implement --provenance (it is
            # absent from `pnpm publish --help`); it accepted the flag, ignored
            # it, and exited 0, so v0.1.0 shipped with no attestation and
            # nothing failed. npm implements it, but cannot be used alone here:
            # packages/cli declares "@stemmory/schema": "workspace:*", which
            # only pnpm rewrites to a real version at pack time. `npm publish`
            # straight from the package dir would ship the literal
            # "workspace:*" and break every install.
            #
            # `pnpm pack` does the rewrite; `npm publish <tarball>` does the
            # provenance. Verified: the packed tarball declares "0.1.0".
            pnpm --filter stemmory exec pnpm pack --pack-destination "$RUNNER_TEMP"
            tgz=$(ls "$RUNNER_TEMP"/*.tgz | head -1)
            npm publish "$tgz" --access public --provenance --tag "$npm_tag"
            rm -f "$tgz"
          fi

      # v0.1.0 published with NO provenance and the run was still green,
      # because pnpm accepted --provenance, ignored it, and exited 0. A flag
      # that can be silently ignored needs a check that cannot be. This step
      # fails the run if either package landed without an attestation, so the
      # same regression can never pass unnoticed twice.
      #
      # Queried against the registry's attestations endpoint rather than the
      # packument: the packument does not expose attestations, so reading it
      # would report "none" for a package that has them, which is how this
      # went undiagnosed the first time.
      - name: Verify provenance attestations exist
        run: |
          fail=0
          schema_v=$(node -p "require('./packages/schema/package.json').version")
          cli_v=$(node -p "require('./packages/cli/package.json').version")
          for spec in "@stemmory/schema@$schema_v" "stemmory@$cli_v"; do
            enc=$(printf '%s' "$spec" | sed 's|/|%2F|')
            n=$(curl -sf "https://registry.npmjs.org/-/npm/v1/attestations/$enc" \
                 | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log((JSON.parse(d).attestations||[]).length)}catch(e){console.log(0)}})') || n=0
            if [ "${n:-0}" -gt 0 ]; then
              echo "$spec: $n attestation(s)"
            else
              echo "::error::$spec published without a provenance attestation" >&2
              fail=1
            fi
          done
          exit "$fail"

